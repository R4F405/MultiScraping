# nginx para Coolify: el SSL lo termina Traefik (proxy de Coolify), que
# reenvía aquí en HTTP. Por eso solo hay un server en el puerto 80.
events {
    worker_connections 1024;
}

http {
    # Respetar el esquema original (https) que envía Traefik; si no viene,
    # usar el de esta conexión.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    # WebSockets (noVNC). Se definen aquí y NO dentro de los location: si un
    # location tiene algún proxy_set_header, deja de heredar todos estos
    # (incluido Host) y la app genera URLs con "scraperleadweb:8081".
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    client_max_body_size 50m;

    # DNS interno de Docker: re-resolver en cada petición para no quedarse
    # con la IP de un contenedor recreado en un redeploy (evita 502).
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location /novnc/ {
            set $linkedinleads_upstream linkedinleads:6080;
            proxy_pass http://$linkedinleads_upstream/;
            proxy_read_timeout 3600s;
        }

        location / {
            set $scraperleadweb_upstream scraperleadweb:8081;
            proxy_pass http://$scraperleadweb_upstream;
        }
    }
}
