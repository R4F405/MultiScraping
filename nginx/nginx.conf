events {
    worker_connections 1024;
}

http {
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    # HTTP server (port 80 inside container, only used for testing without SSL)
    server {
        listen 80;
        server_name _;

        location /novnc/ {
            proxy_pass http://linkedinleads:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://scraperleadweb:8081;
        }
    }

    # HTTPS server (port 443 inside container, mapped to 9090 outside)
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/vps-d6ea56ba.vps.ovh.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vps-d6ea56ba.vps.ovh.net/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location /novnc/ {
            proxy_pass http://linkedinleads:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://scraperleadweb:8081;
        }
    }
}
